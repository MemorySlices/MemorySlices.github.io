<svg xmlns="http://www.w3.org/2000/svg" width="320" height="224" viewBox="0 0 320 224">
  <title>Optical flow between two video frames</title>
  <desc>A ball shifts slightly right and up between consecutive video frames while the background stays still. Below, short diagonal arrows show the same two-dimensional pixel displacement. Background dots represent no motion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M1 1 5 3 1 5" fill="none" stroke="#3f6d62" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="ball">
      <circle r="18" fill="#d6ae89" stroke="#8a593e" stroke-width="1.3"/>
      <path d="M-8-10Q-2-14 5-10" fill="none" stroke="#f5e9d9" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="still-points" fill="#a8b2a7">
      <circle cy="156" r="1.4"/>
      <circle cy="177" r="1.4"/>
      <circle cy="198" r="1.4"/>
    </g>
  </defs>
  <g font-family="Palatino, Georgia, serif" font-size="15" text-anchor="middle" fill="#424640">
    <text x="81" y="16">Frame t</text>
    <text x="239" y="16">Frame t + 1</text>
    <g fill="#f7f7ec" stroke="#c9cec1" stroke-width="1">
      <rect x="12" y="27" width="138" height="76" rx="3"/>
      <rect x="170" y="27" width="138" height="76" rx="3"/>
      <rect x="12" y="143" width="296" height="68" rx="3"/>
    </g>
    <g stroke="#d8dccf" stroke-width="1" fill="none">
      <path d="M13 83H149M171 83H307"/>
      <path d="M121 37V46M117 41.5H125M279 37V46M275 41.5H283"/>
    </g>
    <use href="#ball" x="56" y="65"/>
    <use href="#ball" x="220" y="60"/>
    <text x="160" y="131">2D motion</text>
    <use href="#still-points" x="36"/>
    <use href="#still-points" x="64"/>
    <use href="#still-points" x="92"/>
    <use href="#still-points" x="196"/>
    <use href="#still-points" x="224"/>
    <use href="#still-points" x="252"/>
    <use href="#still-points" x="280"/>
    <circle cx="126" cy="177" r="18" fill="#eedcc8" stroke="#ba9b7f" stroke-width="1.2"/>
    <circle cx="132" cy="172" r="18" fill="none" stroke="#ba9b7f" stroke-width="1.2" stroke-dasharray="3 3"/>
    <g fill="none" stroke="#3f6d62" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M118 168l6-5"/>
      <path d="M130 168l6-5"/>
      <path d="M118 178l6-5"/>
      <path d="M130 178l6-5"/>
      <path d="M118 187l6-5"/>
      <path d="M130 187l6-5"/>
    </g>
    <g fill="#3f6d62">
      <circle cx="118" cy="168" r="1.2"/>
      <circle cx="130" cy="168" r="1.2"/>
      <circle cx="118" cy="178" r="1.2"/>
      <circle cx="130" cy="178" r="1.2"/>
      <circle cx="118" cy="187" r="1.2"/>
      <circle cx="130" cy="187" r="1.2"/>
    </g>
  </g>
</svg>
