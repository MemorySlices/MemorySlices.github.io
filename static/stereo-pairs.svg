<svg xmlns="http://www.w3.org/2000/svg" width="320" height="232" viewBox="0 0 320 232">
  <title>A stereo image pair</title>
  <desc>Two side-by-side cameras see the same cube. The cube appears farther right in the left image and farther left in the right image.</desc>
  <defs>
    <g id="cube" stroke="#8a593e" stroke-width="1.3" stroke-linejoin="round">
      <path d="M0-16 15-8 0 0-15-8Z" fill="#eedcc8"/>
      <path d="M-15-8 0 0 0 19-15 11Z" fill="#d6ae89"/>
      <path d="M0 0 15-8 15 11 0 19Z" fill="#b77f55"/>
    </g>
    <g id="camera" fill="#fffff8" stroke="#4d625d" stroke-width="1.5">
      <path d="M-7-8V-14H7V-8"/>
      <rect x="-17" y="-8" width="34" height="18" rx="3"/>
      <path d="M-12-2H-5"/>
      <circle cx="10" cy="2" r="1.5" fill="#4d625d" stroke="none"/>
    </g>
  </defs>
  <g font-family="Palatino, Georgia, serif" font-size="15" text-anchor="middle" fill="#424640">
    <text x="160" y="16">Same scene</text>
    <path d="M78 94 153 56M242 94 167 56" stroke="#71877f" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
    <use href="#cube" x="160" y="41"/>
    <use href="#camera" x="78" y="108"/>
    <use href="#camera" x="242" y="108"/>
    <path d="M78 123V137M242 123V137" stroke="#a5afa6" stroke-width="1.2"/>
    <g fill="#f7f7ec" stroke="#c9cec1" stroke-width="1">
      <rect x="12" y="142" width="138" height="65" rx="3"/>
      <rect x="170" y="142" width="138" height="65" rx="3"/>
    </g>
    <g stroke="#d8dccf" stroke-width="1" fill="none">
      <path d="M13 179H149M171 179H307"/>
      <path d="M81 148V201M239 148V201" stroke-dasharray="3 4"/>
    </g>
    <use href="#cube" x="95" y="175"/>
    <use href="#cube" x="225" y="175"/>
    <text x="81" y="227">Left view</text>
    <text x="239" y="227">Right view</text>
  </g>
</svg>
